<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKYLINE RUNNER</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">MVP / SIDE-SCROLL ACTION</p>
          <h1>SKYLINE RUNNER</h1>
        </div>
        <div class="top-actions">
          <button id="music-button" class="restart-button" type="button">MUSIC <span>♪</span></button>
          <button id="restart-button" class="restart-button" type="button">RESTART <span>↻</span></button>
        </div>
      </header>

      <section class="game-card" aria-label="横スクロールアクションゲーム">
        <div class="hud">
          <div class="hud-item"><span class="hud-label">SCORE</span><strong id="score">000000</strong></div>
          <div class="hud-item"><span class="hud-label">COINS</span><strong id="coins">0 / 6</strong></div>
          <div class="hud-item"><span class="hud-label">STAGE</span><strong id="stage">1 / 3</strong></div>
          <div class="hud-item"><span class="hud-label">STATUS</span><strong id="status">RUNNING</strong></div>
        </div>
        <canvas id="game-canvas" width="960" height="540" aria-label="ゲーム画面"></canvas>
        <div id="message" class="message" aria-live="polite">
          <span class="message-kicker">READY?</span>
          <strong>RUN TO THE SIGNAL</strong>
          <small>PRESS SPACE OR TAP TO START</small>
        </div>
      </section>

      <footer class="controls">
        <span><kbd>A</kbd><kbd>D</kbd> MOVE</span>
        <span><kbd>SPACE</kbd> HOLD TO JUMP HIGHER</span>
        <span class="stage-select">STAGE <button data-stage="0" class="active" type="button">1</button><button data-stage="1" type="button">2</button><button data-stage="2" type="button">3</button></span>
        <span class="tip">赤い敵は踏める / 紫の装甲敵は踏んでも倒せない</span>
      </footer>
    </main>
    <script type="module" src="game.js"></script>
  </body>
</html>
