<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ネオン疾走</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">横スクロール・アクション</p>
          <h1>ネオン疾走</h1>
        </div>
        <div class="top-actions">
          <button id="music-button" class="restart-button" type="button">音楽 <span>♪</span></button>
          <button id="restart-button" class="restart-button" type="button">再開 <span>↻</span></button>
        </div>
      </header>

      <section class="game-card" aria-label="横スクロールアクションゲーム">
        <div class="hud">
          <div class="hud-item"><span class="hud-label">スコア</span><strong id="score">000000</strong></div>
          <div class="hud-item"><span class="hud-label">お守り</span><strong id="coins">0 / 6</strong></div>
          <div class="hud-item"><span class="hud-label">エリア</span><strong id="stage">1 / 3</strong></div>
          <div class="hud-item"><span class="hud-label">状態</span><strong id="status">待機中</strong></div>
        </div>
        <canvas id="game-canvas" width="960" height="540" aria-label="ゲーム画面"></canvas>
        <div id="message" class="message" aria-live="polite">
          <span class="message-kicker">準備はいい？</span>
          <strong>光を目指せ</strong>
          <small>スペースキーまたは画面タップで開始</small>
        </div>
      </section>

      <footer class="controls">
        <span><kbd>A</kbd><kbd>D</kbd> 移動</span>
        <span><kbd>SPACE</kbd> 長押しで高くジャンプ</span>
        <span class="stage-select">エリア <button data-stage="0" class="active" type="button">1</button><button data-stage="1" type="button">2</button><button data-stage="2" type="button">3</button></span>
        <span class="tip">赤い敵は踏める / 紫の鎧武者は踏んでも倒せない</span>
      </footer>
    </main>
    <script type="module" src="game.js"></script>
  </body>
</html>
